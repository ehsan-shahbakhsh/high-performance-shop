version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shop-app
    container_name: shop_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: shop_db
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      OCTANE_SERVER: swoole
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - shop-net
    # command: tail -f /dev/null
    command: php artisan octane:start --host=0.0.0.0 --port=8000 --watch

  mysql:
    image: mysql:8.0
    container_name: shop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - shop-net

  redis:
    image: redis:alpine
    container_name: shop_redis
    restart: always
    ports:
      - "6380:6379"
    networks:
      - shop-net

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: shop_centrifugo
    restart: always
    ports:
      - "8080:8000"
    command: centrifugo -c config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - shop-net

networks:
  shop-net:
    driver: bridge

volumes:
  db_data:
